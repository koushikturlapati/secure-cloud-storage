<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">

    <h1 style="text-align: center; color: rgb(13, 0, 255);">Secure cloud storage</h1>
   <h2>Add your files here in the grey space</h2>
    

    <!-- HERE IS YOUR FIGMA DROPZONE CONTAINER WITH INLINE CSS -->
    <div style="
        width: 100%; 
        max-width: 1200px; 
        height: 350px; 
        background-color: #D9D9D9; 
        opacity: 1; 
        border-radius: 0px; 
        border: 2px dashed #a0a0a0;
        display: flex; 
        align-items: center; 
        justify-content: center;
        margin-top: 40px;
    ">
        <p style="font-size: 20px; color: #333333; font-weight: bold; margin: 0;">
            
        </p>
    </div>
   <table style="width: 100%; max-width: 1200px; text-align: left; margin-bottom: 40px; border-collapse: collapse;">
        
    <h3>Your Files</h3>
    <tr>
            <th>FileName</th>
            <th>size</th>
            <th>Security</th>
            <th>Actions</th>
        </tr>
        <tr>
            <td>My lovestory</td>
            <td>2.5MB</td>
            <td>Encrypted</td>
            <td>
                <button>Download</button> 
                <button>Edit</button>
                <button>Delete</button>
            </td>
        </tr>
    </table> 
    <p> Storage Used 2.5mb/ 10gb</p>

</html>
