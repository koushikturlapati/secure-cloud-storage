<!DOCTYPE html>
<html>

<head>
    <title>Secure Cloud Storage</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main">
        <h1>Secure Cloud Storage</h1>
        <h3 style="text-align: center;">Login</h3>

        <form id="loginForm">
            <label for="username">
                Username:
            </label>
            <input type="text"
            id="username"
            name="username"
            placeholder="Enter your username" autocomplete="username" required>

            <label for="password">
                Password:
            </label>
            <input type="password" id="password" name="password" 
            placeholder="Enter your password" autocomplete="current-password" required>

            <div class="wrap">
                <button type="submit">
                    Submit
                </button>
            </div>
        </form>
        <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
        
        <p>Not registered?
            <a href="createacc.html" style="text-decoration: none;">
                Create an account
            </a>
        </p>
    </div>
    <script src="login.js"></script>
</body>

</html>
